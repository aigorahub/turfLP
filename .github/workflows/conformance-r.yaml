# Shared conformance suite: fixtures are current, the generator self-test
# passes, and the R package passes every fixture.
on:
  push:
  pull_request:

name: conformance-r.yaml

permissions: read-all

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 conformance/generate.py --check
      - run: python3 conformance/test_generate.py
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::jsonlite, any::pkgload
      - run: Rscript conformance/run_r.R
