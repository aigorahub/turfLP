# JavaScript package: type check, build, and tests (including the shared
# conformance suite) on three platforms, plus the Next.js standalone test.
on:
  push:
  pull_request:

name: js.yaml

permissions: read-all

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  nextjs:
    runs-on: ubuntu-latest
    name: Next.js standalone test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
        working-directory: js
      - run: node scripts/standalone-test.mjs
        working-directory: js/examples/nextjs
